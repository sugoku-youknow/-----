<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ためる・バリア・攻撃</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#12161f;
    --panel-2:#171c27;
    --line:#232a38;
    --text:#e8ecf4;
    --sub:#8b93a7;
    --charge:#e8b339;
    --barrier:#3ec9d6;
    --attack:#e0435a;
    --good:#5fd98a;
  }
  html, body { height: 100%; margin: 0; padding: 0; }
  #app, #app *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  #app{
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    min-height:640px;
    padding:28px 20px 36px;
    border-radius:14px;
    position:relative;
    overflow:hidden;
  }
  #app::before{
    content:'';
    position:absolute; inset:0;
    background:
      radial-gradient(600px 300px at 15% -10%, rgba(232,179,57,0.08), transparent 60%),
      radial-gradient(600px 300px at 85% 110%, rgba(224,67,90,0.08), transparent 60%);
    pointer-events:none;
  }
  .wrap{ position:relative; max-width:640px; margin:0 auto; }
  .brand{
    text-align:center; margin-bottom:22px;
  }
  .brand .mark{
    font-size:11px; letter-spacing:.28em; color:var(--sub); text-transform:uppercase;
  }
  .brand h1{
    margin:6px 0 0; font-size:28px; font-weight:800; letter-spacing:.02em;
  }
  .brand h1 .a{color:var(--charge)} .brand h1 .b{color:var(--barrier)} .brand h1 .c{color:var(--attack)}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
  }
  .row{ display:flex; gap:12px; }
  .btn{
    flex:1; padding:13px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .12s, border-color .12s, background .12s;
    letter-spacing:.02em;
  }
  .btn:hover:not(:disabled){ transform:translateY(-1px); border-color:#3a4356; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(135deg,#2a3244,#1b2130); border-color:#3a4356; }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:16px; letter-spacing:.08em;
  }
  input[type=text]:focus{ outline:none; border-color:#5a6478; }
  .label{ font-size:12px; color:var(--sub); margin-bottom:6px; letter-spacing:.05em; }
  .center{ text-align:center; }
  .muted{ color:var(--sub); font-size:13px; }
  .code{
    font-size:34px; font-weight:800; letter-spacing:.22em; text-align:center;
    padding:16px 0; color:var(--charge);
  }

  /* --- battle screen --- */
  .players{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .pcard{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .pcard.me{ border-color:#33405a; }
  .pname{ font-size:13px; color:var(--sub); display:flex; justify-content:space-between; margin-bottom:8px; }
  .pname .you{ color:var(--barrier); font-size:11px; letter-spacing:.05em; }
  .hpbar{ height:10px; border-radius:6px; background:#1d2330; overflow:hidden; border:1px solid var(--line); }
  .hpfill{ height:100%; background:linear-gradient(90deg,#e0435a,#f2794a); transition:width .5s ease; }
  .hpnum{ font-size:12px; color:var(--sub); margin-top:5px; text-align:right; }
  .pips{ display:flex; gap:4px; margin-top:10px; }
  .pip{ width:16px; height:16px; border-radius:4px; background:#232a38; border:1px solid var(--line); }
  .pip.on{ background:var(--charge); border-color:var(--charge); box-shadow:0 0 8px rgba(232,179,57,.5); }

  .vs{
    align-self:center; font-size:11px; color:var(--sub); letter-spacing:.15em;
    display:flex; align-items:center; gap:10px; width:100%;
  }
  .vs::before, .vs::after{ content:''; flex:1; height:1px; background:var(--line); }

  .arena{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px; margin-bottom:14px; min-height:64px;
  }
  .arena .msg{ font-size:14px; line-height:1.7; color:var(--text); }
  .arena .msg b{ color:var(--charge); }
  .round{ font-size:12px; color:var(--sub); letter-spacing:.08em; margin-bottom:6px; }

  .actions{ display:flex; gap:10px; margin-top:16px; }
  .abtn{
    flex:1; padding:16px 8px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); cursor:pointer; text-align:center;
    transition:transform .12s, border-color .12s;
  }
  .abtn:hover:not(.disabled):not(.picked){ transform:translateY(-2px); }
  .abtn .ic{ font-size:22px; display:block; margin-bottom:4px; }
  .abtn .tt{ font-size:13px; font-weight:700; }
  .abtn .sub{ font-size:10px; color:var(--sub); margin-top:2px; }
  .abtn.charge{ border-color:#4a4326; } .abtn.charge:hover:not(.disabled):not(.picked){ border-color:var(--charge); }
  .abtn.barrier{ border-color:#264247; } .abtn.barrier:hover:not(.disabled):not(.picked){ border-color:var(--barrier); }
  .abtn.attack{ border-color:#472129; } .abtn.attack:hover:not(.disabled):not(.picked){ border-color:var(--attack); }
  .special-wrap{ width:100%; max-width:600px; margin-top:8px; }
  .special-btn{ width:100%; padding:14px 10px; border-radius:10px; border:2px solid #9a5f16; background:#fff0c2; color:#16202c; cursor:pointer; text-align:center; font-weight:800; transition:transform .12s, border-color .12s, background .12s; }
  .special-btn:hover:not(.disabled){ transform:translateY(-2px); border-color:#c27a1d; background:#ffe7a0; }
  .special-btn .tt{ font-size:15px; }
  .special-btn .sub{ font-size:10px; margin-top:3px; color:#6b5a32; }
  .special-btn.disabled{ opacity:.35; cursor:not-allowed; }
  .abtn.picked.charge{ background:rgba(232,179,57,.15); border-color:var(--charge); }
  .abtn.picked.barrier{ background:rgba(62,201,214,.15); border-color:var(--barrier); }
  .abtn.picked.attack{ background:rgba(224,67,90,.15); border-color:var(--attack); }
  .abtn.disabled{ opacity:.3; cursor:not-allowed; }
  .abtn.startbtn{ background:#eafff0; border-color:#2f9e52; }
  .abtn.startbtn .tt{ color:#1f7a3d; font-size:16px; }

  .hpsetter{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin-top:10px; width:100%; max-width:600px;
  }
  .hpsetter-label{ font-size:12px; font-weight:700; color:#16202c; }
  .setting-panel{ margin:18px auto 0; max-width:420px; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); }
  .battle-setting-panel{ margin-top:10px; background:#fff; border:2px solid #16202c; }
  /* 準備画面のホスト操作はレイアウトの流れから切り離す。
     チャージ枠が何段になっても位置が押し下げられない。 */
  .host-ready-start{
    position:absolute;
    z-index:50;
    top:32%;
    left:50%;
    width:min(600px, calc(100% - 32px));
    transform:translate(-50%, -50%);
    pointer-events:auto;
  }
  .host-ready-start .abtn{
    width:100%; box-sizing:border-box;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .host-ready-settings{
    position:fixed;
    z-index:60;
    left:50%;
    bottom:14px;
    width:min(520px, calc(100% - 32px));
    transform:translateX(-50%);
    margin:0;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
  }
  .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:8px 0; }
  .setting-row + .setting-row{ border-top:1px solid var(--line); }
  .setting-label{ font-size:13px; font-weight:700; text-align:left; }
  .setting-ctrl{ display:flex; align-items:center; gap:10px; }
  .setting-note{ margin-top:8px; font-size:11px; color:var(--sub); }
  .hpctrl{ display:flex; align-items:center; gap:10px; }
  .hpbtn{
    width:30px; height:30px; border-radius:6px; border:2px solid #16202c;
    background:#fff; color:#16202c; font-size:16px; font-weight:800; cursor:pointer; line-height:1;
  }
  .hpbtn:active{ transform:scale(0.95); }
  .hpval{ font-size:16px; font-weight:800; color:#16202c; min-width:34px; text-align:center; }

  .waitline{ text-align:center; font-size:12px; color:var(--sub); margin-top:12px; }

  .reveal-title{ text-align:center; font-size:12px; color:var(--sub); letter-spacing:.1em; margin-top:14px; margin-bottom:10px; }
  .reveal{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .reveal-card{
    flex:1; max-width:150px; text-align:center; padding:16px 8px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel-2);
    animation: reveal-pop .28s ease;
  }
  .reveal-card .who{ font-size:11px; color:var(--sub); margin-bottom:6px; }
  .reveal-card .ic{ font-size:26px; display:block; }
  .reveal-card .tt{ font-size:14px; font-weight:700; display:block; margin-top:4px; }
  .reveal-card.charge{ border-color:var(--charge); background:rgba(232,179,57,.12); }
  .reveal-card.barrier{ border-color:var(--barrier); background:rgba(62,201,214,.12); }
  .reveal-card.attack{ border-color:var(--attack); background:rgba(224,67,90,.12); }
  .reveal-x{ font-size:16px; color:var(--sub); }
  @keyframes reveal-pop{ from{ transform:scale(0.85); opacity:0; } to{ transform:scale(1); opacity:1; } }

  /* --- split duel layout --- */
  #app.mode-duel{ padding:0; background:var(--bg); height:100vh; min-height:100vh; display:flex; flex-direction:column; border-radius:0; overflow-y:auto; }
  #app.mode-duel::before{ display:none; }

  .duel-wrap{
    display:flex; flex-direction:column;
    border:none; border-radius:0; overflow:hidden;
    flex:1;
  }
  .duel-half{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 16px; gap:10px; flex:1;
  }
  .duel-half.opp{ background:#ffd7dd; }
  .duel-half.me{ background:#d6f0fb; }

  .namebox, .hpbox-outer, .actionbox{
    width:100%; max-width:600px;
    background:#fff; border:2.5px solid #16202c; border-radius:5px;
    color:#16202c;
  }
  .namebox{ padding:10px 14px; text-align:center; font-weight:700; font-size:15px; }
  .hpbox-outer{ height:24px; position:relative; overflow:hidden; }
  .hpbox-fill{ height:100%; background:#ffe14d; transition:width .5s ease; }
  .hpbox-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; }

  .actionbox{
    min-height:64px; display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:17px; padding:10px;
  }
  .actionbox .ic{ font-size:22px; }
  .actionbox .ph{ color:#9aa3ad; font-weight:600; font-size:14px; }
  .actionbox.charge{ background:#fff4d8; }
  .actionbox.barrier{ background:#dbf7fa; }
  .actionbox.attack{ background:#fbdde1; }

  .pipsrow{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .pip2{ width:26px; height:26px; border:2.5px solid #16202c; background:#fff; border-radius:5px; }
  .pip2.on{ background:#ffe14d; }

  .divider2{
    height:21px; position:relative; background:var(--bg);
    border-top:2.5px dashed #38424f; border-bottom:2.5px dashed #38424f;
  }
  .timerbar{
    position:absolute; top:0; left:0; height:100%; width:0%;
    background:linear-gradient(90deg,#ff6b7a,#e0435a);
    box-shadow:0 0 10px rgba(224,67,90,.7);
  }

  .duel-half .actions{ margin-top:6px; width:100%; max-width:600px; }
  .duel-half .abtn{
    background:#fff; border:2px solid #16202c; color:#16202c; padding:24px 8px;
  }
  .duel-half .abtn .sub{ display:none; }
  .duel-half .abtn.charge:hover:not(.disabled):not(.picked){ border-color:#c9971f; }
  .duel-half .abtn.barrier:hover:not(.disabled):not(.picked){ border-color:#1f8f9c; }
  .duel-half .abtn.attack:hover:not(.disabled):not(.picked){ border-color:#b8283c; }
  .duel-half .special-wrap{ margin-top:4px; }
  .duel-half .special-btn{ border:2px solid #16202c; background:#fff; }
  .duel-half .special-btn:hover:not(.disabled){ border-color:#9a5f16; background:#fff0c2; }
  .duel-half .abtn.picked.charge{ background:#fff0c2; }
  .duel-half .abtn.picked.barrier{ background:#c8f2f6; }
  .duel-half .abtn.picked.attack{ background:#fac9d0; }

  .meta-line{ text-align:center; font-size:12px; color:var(--sub); margin:0; line-height:1.6; padding:8px; background:var(--bg); }

  @media (max-width: 480px){
    #app.mode-duel{ padding:0; }
    .duel-half{ padding:14px 10px; gap:8px; }
    .namebox{ font-size:13px; padding:8px 10px; }
    .actionbox{ min-height:54px; font-size:15px; }
    .actionbox .ic{ font-size:19px; }
    .pip2{ width:20px; height:20px; }
    .hpsetter{ gap:8px; }
    .meta-line{ font-size:11px; }
  }

  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:#1c2230; border:1px solid var(--line); padding:8px 16px; border-radius:8px;
    font-size:12px; color:var(--good);
  }
  .footer-actions{ display:flex; justify-content:center; margin-top:16px; }
  .link{ color:var(--barrier); font-size:12px; cursor:pointer; background:none; border:none; }

  @media (max-width: 480px){
    #app{ padding:18px 12px 24px; min-height:0; }
    .brand{ margin-bottom:16px; }
    .brand h1{ font-size:21px; }
    .card{ padding:16px; }
    .players{ gap:8px; }
    .pcard{ padding:10px 11px; }
    .pname{ font-size:12px; }
    .hpnum{ font-size:11px; }
    .pip{ width:13px; height:13px; }
    .vs{ font-size:9px; gap:6px; }
    .arena{ padding:14px; margin-bottom:12px; }
    .arena .msg{ font-size:13px; }
    .actions{ gap:7px; }
    .abtn{ padding:14px 4px; border-radius:9px; }
    .abtn .ic{ font-size:20px; }
    .abtn .tt{ font-size:12px; }
    .abtn .sub{ font-size:9px; }
    .code{ font-size:28px; letter-spacing:.16em; }
    .row{ gap:8px; }
    .btn{ padding:14px 8px; font-size:14px; }
    input[type=text]{ font-size:16px; padding:12px; } /* 16px prevents iOS auto-zoom */
  }

  @media (hover: none){
    .abtn:hover:not(.disabled):not(.picked){ transform:none; }
    .btn:hover:not(:disabled){ transform:none; }
    .abtn:active:not(.disabled):not(.picked){ transform:scale(0.97); border-color:#5a6478; }
    .btn:active:not(:disabled){ transform:scale(0.98); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
  "use strict";

  var MAX_HP = 100;
  var MAX_CHARGE = 30;
  var START_HP = 20;
  var START_MAX_CHARGE = 8;
  var BASE_DMG = 10;
  var ID_PREFIX = 'cbs-duel-';
  var TURN_MS = 1000;

  var ACTIONS = {
    charge:  { label:'ためる', icon:'⚡', sub:'次の攻撃を強化', cls:'charge' },
    barrier: { label:'バリア', icon:'🛡', sub:'攻撃を防ぐ', cls:'barrier' },
    attack:  { label:'攻撃',   icon:'⚔', sub:'チャージを1消費', cls:'attack' },
  };

  var app = document.getElementById('app');

  var ui = { screen:'home', nameInput:'プレイヤー' + (Math.floor(Math.random()*90)+10), codeInput:'', toast:'', hostHp:START_HP, hostMaxCharge:START_MAX_CHARGE };

  var role = null;      // 'host' | 'guest'
  var peer = null;
  var conn = null;
  var state = null;      // authoritative game state (mirrored on guest)
  var myMove = null;     // for rendering my own picked button
  var hostPending = { p1:null, p2:null }; // host-side only: pending moves this round
  var reveal = null; // { p1: move, p2: move } shown while both actions are revealed before resolving

  var roundTimeout = null;
  var timerFrame = null;
  var roundClosed = false; // ホスト基準の1秒が終了したか
  var hostClockOffset = 0; // guest: host時刻 - 自分の時刻
  var clockSyncReady = false;
  var clockSyncPending = null;
  var ROUND_START_LEAD_MS = 500; // stateが届く時間を確保してから全員同時に開始

  function clearRoundTimer(){
    if(roundTimeout){ clearTimeout(roundTimeout); roundTimeout = null; }
  }

  function stopTimerBarAnimation(){
    if(timerFrame !== null){
      cancelAnimationFrame(timerFrame);
      timerFrame = null;
    }
  }

  // ラウンドの終了時刻はホストが決め、両者が同じ時刻までバーを進める。
  // 行動を早く選んでも、相手が選ぶまで表示上のラウンドを終了させない。
  function startRoundTimer(){
    clearRoundTimer();
    stopTimerBarAnimation();

    if(!state || state.status !== 'playing') return;

    if(!state.roundEndsAt){
      state.roundEndsAt = Date.now() + TURN_MS;
    }

    roundClosed = false;
    var now = role === 'guest' ? Date.now() + hostClockOffset : Date.now();
    var remaining = Math.max(0, state.roundEndsAt - now);
    roundTimeout = setTimeout(function(){
      roundTimeout = null;
      handleRoundDeadline();
    }, remaining);

    animateTimerBar();
  }

  // 1秒が終わった瞬間にだけラウンドを確定する。
  // これが重要で、「片方が早く選んだからバーが途中で消える」を防ぐ。
  function handleRoundDeadline(){
    if(!state || state.status !== 'playing') return;
    if(roundClosed) return;
    roundClosed = true;

    if(role === 'guest'){
      if(!myMove){
        myMove = moveForAction('barrier');
        if(conn){
          conn.send({ type:'move', round: state.round, move: moveForAction('barrier') });
        }
        render();
      }
      return;
    }

    // ホスト側では、未選択の行動をバリアとして確定する。
    if(!hostPending.p1) hostPending.p1 = moveForAction('barrier');
    if(!hostPending.p2) hostPending.p2 = moveForAction('barrier');
    resolveAtDeadline();
  }

  function resolveAtDeadline(){
    if(role !== 'host' || !roundClosed) return;
    if(!hostPending.p1) hostPending.p1 = moveForAction('barrier');
    if(!hostPending.p2) hostPending.p2 = moveForAction('barrier');

    var m1 = hostPending.p1, m2 = hostPending.p2;
    reveal = { p1: m1, p2: m2 };
    stopTimerBarAnimation();
    if(conn){ conn.send({ type:'reveal', reveal: reveal }); }
    render();
    setTimeout(function(){ finishResolveHost(m1, m2); }, 1400);
  }

  function getTimerPercent(){
    if(!state || state.status !== 'playing' || !state.roundEndsAt) return 0;
    if(role === 'guest' && !clockSyncReady) return 100;
    var now = role === 'guest' ? Date.now() + hostClockOffset : Date.now();
    var start = state.roundStartAt || (state.roundEndsAt - TURN_MS);
    if(now <= start) return 100;
    var elapsed = now - start;
    return Math.max(0, Math.min(100, 100 - (elapsed / TURN_MS * 100)));
  }

  function updateTimerBar(){
    var bar = document.getElementById('timerbar');
    if(!bar) return;
    bar.style.transition = 'none';
    bar.style.width = getTimerPercent() + '%';
  }

  function animateTimerBar(){
    // render()でタイムバーのDOMが作り直されても、アニメーション自体は
    // 再スタートしない。ラウンド終了時刻を唯一の基準にする。
    if(timerFrame !== null) return;

    function tick(){
      var bar = document.getElementById('timerbar');
      if(!bar || !state || state.status !== 'playing' || !state.roundEndsAt){
        timerFrame = null;
        return;
      }

      var percent = getTimerPercent();
      bar.style.transition = 'none';
      bar.style.width = percent + '%';

      if(percent <= 0){
        timerFrame = null;
        return;
      }
      timerFrame = requestAnimationFrame(tick);
    }

    tick();
  }

  function randCode(){
    var chars = '0123456789';
    var s = '';
    for(var i=0;i<1;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function freshState(hostName, guestName, hpSetting, maxChargeSetting){
    var hp = hpSetting || START_HP;
    var maxCharge = maxChargeSetting || START_MAX_CHARGE;
    return {
      round: 1,
      status: 'ready',
      roundStartAt: null,
      roundEndsAt: null,
      winner: null,
      ready: { p1:false, p2:false },
      hpSetting: hp,
      maxChargeSetting: maxCharge,
      players: {
        p1: { name: hostName || 'Player 1', hp: hp, charge:0, maxCharge:maxCharge },
        p2: { name: guestName || 'Player 2', hp: hp, charge:0, maxCharge:maxCharge },
      },
      log: [{ round:0, text:'両者の準備が整うとバトル開始！' }],
    };
  }

  function moveAction(move){
    if(!move) return null;
    return typeof move === 'string' ? move : move.action;
  }

  function moveAttackCount(move){
    if(moveAction(move) !== 'attack') return 0;
    if(typeof move === 'object' && move.count != null) return Math.max(1, Math.floor(move.count));
    return 1;
  }

  function moveForAction(action, count){
    return action === 'attack' ? { action:'attack', count:Math.max(1, count || 1) } : { action:action };
  }

  function resolveRound(p1, p2, m1, m2){
    var hp1=p1.hp, hp2=p2.hp, c1=p1.charge, c2=p2.charge;
    var lines = [];
    var a1=moveAction(m1), a2=moveAction(m2);
    var n1=moveAttackCount(m1), n2=moveAttackCount(m2);

    // 攻撃は押した回数だけチャージを消費する。
    if(a1==='charge'){ c1=Math.min(p1.maxCharge || MAX_CHARGE,c1+1); }
    else if(a1==='attack'){ c1=Math.max(0,c1-n1); }
    if(a2==='charge'){ c2=Math.min(p2.maxCharge || MAX_CHARGE,c2+1); }
    else if(a2==='attack'){ c2=Math.max(0,c2-n2); }

    // 攻撃同士は相殺。バリアには完全に防がれる。
    // それ以外には「攻撃ボタンを押した回数 × 10」のダメージ。
    var dmg1to2=0, dmg2to1=0;
    if(a1==='attack' && a2!=='attack') dmg1to2=(a2==='barrier')?0:BASE_DMG*n1;
    if(a2==='attack' && a1!=='attack') dmg2to1=(a1==='barrier')?0:BASE_DMG*n2;
    hp2=Math.max(0,hp2-dmg1to2);
    hp1=Math.max(0,hp1-dmg2to1);

    if(a1==='charge' && a2==='charge') lines.push('二人とも「ためる」を選択。両者のチャージが1溜まった。');
    else if(a1==='barrier' && a2==='barrier') lines.push('二人とも「バリア」。何も起こらなかった。');
    else if(a1==='charge' && a2==='barrier') lines.push('P1はチャージ、P2はバリア。P1のチャージが1溜まった。');
    else if(a1==='barrier' && a2==='charge') lines.push('P2はチャージ、P1はバリア。P2のチャージが1溜まった。');
    else if(a1==='attack' && a2==='attack') lines.push('両者「攻撃」が激突！ 相殺してダメージなし。');
    else if(a1==='attack' && a2==='barrier') lines.push('P1の'+n1+'回攻撃はP2の「バリア」に防がれた。');
    else if(a1==='barrier' && a2==='attack') lines.push('P2の'+n2+'回攻撃はP1の「バリア」に防がれた。');
    else if(a1==='attack' && a2==='charge') lines.push('P2が「ためる」の隙をP1が'+n1+'回攻撃！ '+dmg1to2+'ダメージ！');
    else if(a1==='charge' && a2==='attack') lines.push('P1が「ためる」の隙をP2が'+n2+'回攻撃！ '+dmg2to1+'ダメージ！');

    return {hp1:hp1,hp2:hp2,c1:c1,c2:c2,text:lines.join(' ')};
  }

  function showToast(msg, ms){
    ui.toast = msg;
    render();
    setTimeout(function(){ ui.toast=''; render(); }, ms || 2500);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // PeerJSの通信遅延と端末時計のずれを補正する。
  // 1回だけではなく複数回測定し、最もRTTが短かったサンプルを採用する。
  function startClockSync(){
    if(role !== 'guest' || !conn) return;
    if(clockSyncReady) return;
    if(!clockSyncPending){
      clockSyncPending = { count:0, bestRtt:Infinity, bestOffset:0 };
    }
    sendClockSyncSample();
  }

  function sendClockSyncSample(){
    if(role !== 'guest' || !conn || !clockSyncPending) return;
    var t0 = Date.now();
    conn.send({ type:'clock-sync', t0:t0 });
  }

  function handleClockSync(msg){
    if(role === 'host' && msg.type === 'clock-sync'){
      if(!conn) return;
      conn.send({ type:'clock-sync-reply', t0:msg.t0, th:Date.now() });
      return;
    }
    if(role === 'guest' && msg.type === 'clock-sync-reply'){
      if(clockSyncReady) return;
      var t3 = Date.now();
      var rtt = Math.max(0, t3 - msg.t0);
      var offset = msg.th - (msg.t0 + rtt / 2);
      if(!clockSyncPending){
        clockSyncPending = { count:0, bestRtt:Infinity, bestOffset:0 };
      }
      clockSyncPending.count++;
      if(rtt < clockSyncPending.bestRtt){
        clockSyncPending.bestRtt = rtt;
        clockSyncPending.bestOffset = offset;
      }
      if(clockSyncPending.count >= 5){
        hostClockOffset = clockSyncPending.bestOffset;
        clockSyncReady = true;
        clockSyncPending = null;
        if(state && state.status === 'playing'){ render(); startRoundTimer(); }
      } else {
        setTimeout(sendClockSyncSample, 80);
      }
    }
  }

  // ---------- navigation ----------
  function goHome(){ ui.screen='home'; render(); }
  function goCreate(){ createRoom(); }
  function goJoin(){ ui.screen='join'; render(); }

  // ---------- host ----------
  function createRoom(){
    if(typeof Peer === 'undefined'){
      showToast('通信ライブラリの読み込みに失敗しました。回線を確認して再読み込みしてください', 4000);
      return;
    }
    var code = randCode();
    role = 'host';
    ui.screen = 'creating';
    render();

    peer = new Peer(ID_PREFIX + code);

    peer.on('open', function(){
      ui.roomCode = code;
      ui.screen = 'battle-wait';
      render();
    });

    peer.on('connection', function(c){
      conn = c;
      conn.on('open', function(){ /* wait for join message */ });
      conn.on('data', function(msg){ handleHostData(msg); });
      conn.on('close', function(){
        showToast('相手との接続が切れました', 3000);
      });
    });

    peer.on('error', function(err){
      console.error(err);
      showToast('接続エラーが発生しました(' + err.type + ')。もう一度お試しください', 4000);
      ui.screen = 'home';
      render();
    });
  }

  function handleHostData(msg){
    if(msg.type === 'clock-sync') { handleClockSync(msg); return; }
    if(msg.type === 'join'){
      state = freshState(ui.nameInput.trim() || 'Player 1', msg.name || 'Player 2', ui.hostHp, ui.hostMaxCharge);
      hostPending = { p1:null, p2:null };
      ui.screen = 'battle';
      render();
      conn.send({ type:'state', state: state });
      return;
    }
    if(msg.type === 'ready'){
      if(!state || state.status !== 'ready') return;
      state.ready.p2 = true;
      checkReadyStart();
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
      return;
    }
    if(msg.type === 'move'){
      if(!state || msg.round !== state.round || roundClosed) return;
      var guestMove=msg.move;
      var guestAction=moveAction(guestMove);
      if(['charge','barrier','attack'].indexOf(guestAction)===-1) return;
      if(guestAction==='attack'){
        var guestCount=moveAttackCount(guestMove);
        if(guestCount<1 || guestCount>state.players.p2.charge) return;
        guestMove=moveForAction('attack',guestCount);
      } else { guestMove=moveForAction(guestAction); }
      hostPending.p2=guestMove;
      render();
      return;
    }
    if(msg.type === 'special-win'){
      if(!state || state.status !== 'playing' || msg.round !== state.round || roundClosed) return;
      if(state.players.p2.charge < state.players.p2.maxCharge) return;
      clearRoundTimer();
      stopTimerBarAnimation();
      state.status = 'finished';
      state.winner = 'p2';
      state.log = state.log.concat([{ round: state.round, text:'P2が上限チャージを使い、バリアを貫通する必殺技で問答無用の勝利！' }]);
      hostPending = { p1:null, p2:null };
      reveal = null;
      myMove = null;
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
      return;
    }
    if(msg.type === 'restart-request'){
      doRestart();
      return;
    }
  }

  function checkReadyStart(){
    if(state.status === 'ready' && state.ready.p1 && state.ready.p2){
      state.status = 'playing';
      // ホストが未来の開始時刻を確定する。通信遅延中にバーが途中から始まらないよう、
      // 500msの余裕を持たせ、両者が同じ開始時刻を迎える。
      state.roundStartAt = Date.now() + ROUND_START_LEAD_MS;
      state.roundEndsAt = state.roundStartAt + TURN_MS;
      roundClosed = false;
      startRoundTimer();
    }
  }

  function tryResolveHost(){
    // 両者が選択しても、1秒が終わるまでは確定しない。
    // タイムバーの表示をホスト・ゲストで同じにするため、確定時刻を一本化する。
    render();
  }

  function finishResolveHost(m1, m2){
    var res = resolveRound(state.players.p1, state.players.p2, m1, m2);
    state.players.p1.hp = res.hp1; state.players.p1.charge = res.c1;
    state.players.p2.hp = res.hp2; state.players.p2.charge = res.c2;
    state.log = state.log.concat([{ round: state.round, text: res.text }]);
    if(res.hp1<=0 || res.hp2<=0){
      state.status = 'finished';
      state.winner = (res.hp1<=0 && res.hp2<=0) ? 'draw' : (res.hp1<=0 ? 'p2' : 'p1');
    } else {
      state.round = state.round + 1;
      // 次ラウンドも未来の開始時刻を共有し、両者が同じ時刻から1秒を進める。
      state.roundStartAt = Date.now() + ROUND_START_LEAD_MS;
      state.roundEndsAt = state.roundStartAt + TURN_MS;
      roundClosed = false;
    }
    hostPending = { p1:null, p2:null };
    reveal = null;
    myMove = null;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
    if(state.status === 'playing'){ startRoundTimer(); }
  }

  function doRestart(){
    var hostName = state.players.p1.name, guestName = state.players.p2.name;
    var hpSetting = state.hpSetting;
    var maxChargeSetting = state.maxChargeSetting;
    state = freshState(hostName, guestName, hpSetting, maxChargeSetting);
    hostPending = { p1:null, p2:null };
    reveal = null;
    myMove = null;
    clearRoundTimer();
    stopTimerBarAnimation();
    roundClosed = false;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  // ---------- guest ----------
  function joinRoom(){
    if(typeof Peer === 'undefined'){
      showToast('通信ライブラリの読み込みに失敗しました。回線を確認して再読み込みしてください', 4000);
      return;
    }
    var code = ui.codeInput.trim().toLowerCase();
    if(!code){ showToast('部屋コードを入力してください'); return; }

    role = 'guest';
    clockSyncReady = false;
    clockSyncPending = null;
    hostClockOffset = 0;
    ui.screen = 'joining';
    render();

    peer = new Peer();

    peer.on('open', function(){
      conn = peer.connect(ID_PREFIX + code, { reliable:true });

      conn.on('open', function(){
        conn.send({ type:'join', name: ui.nameInput.trim() || 'Player 2' });
        setTimeout(startClockSync, 100);
      });
      conn.on('data', function(msg){ handleGuestData(msg); });
      conn.on('close', function(){
        showToast('相手との接続が切れました', 3000);
      });
      conn.on('error', function(err){
        console.error(err);
        showToast('接続に失敗しました。コードを確認してください', 3500);
        ui.screen = 'join';
        render();
      });
    });

    peer.on('error', function(err){
      console.error(err);
      var msg = (err.type === 'peer-unavailable')
        ? '部屋が見つかりません。コードをご確認ください'
        : '接続エラーが発生しました(' + err.type + ')';
      showToast(msg, 4000);
      ui.screen = 'join';
      render();
    });
  }

  function handleGuestData(msg){
    if(msg.type === 'clock-sync-reply') { handleClockSync(msg); return; }
    if(msg.type === 'reveal'){
      clearRoundTimer();
      stopTimerBarAnimation();
      reveal = msg.reveal;
      render();
      return;
    }
    if(msg.type === 'state'){
      state = msg.state;
      reveal = null;
      myMove = null;
      ui.screen = 'battle';
      roundClosed = false;
      render();
      if(state.status === 'playing'){
        if(role === 'guest' && !clockSyncReady){ startClockSync(); }
        else { startRoundTimer(); }
      } else { clearRoundTimer(); }
    }
  }

  // ---------- shared ----------
  function pressStart(){
    if(!state || state.status !== 'ready') return;
    if(role === 'host'){
      state.ready.p1 = true;
      checkReadyStart();
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
    } else {
      if(!clockSyncReady){
        showToast('時計を同期しています。少し待ってからスタートしてください', 1800);
        startClockSync();
        return;
      }
      state.ready.p2 = true; // optimistic local update
      if(conn){ conn.send({ type:'ready' }); }
      render();
    }
  }

  function adjustHostHp(delta){
    if(role !== 'host' || !state || state.status !== 'ready') return;
    var next = Math.max(10, Math.min(MAX_HP, state.hpSetting + delta));
    state.hpSetting = next;
    state.players.p1.hp = next;
    state.players.p2.hp = next;
    ui.hostHp = next;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  function adjustHostMaxCharge(delta){
    if(role !== 'host' || !state || state.status !== 'ready') return;
    var next = Math.max(1, Math.min(MAX_CHARGE, state.maxChargeSetting + delta));
    state.maxChargeSetting = next;
    state.players.p1.maxCharge = next;
    state.players.p2.maxCharge = next;
    ui.hostMaxCharge = next;
    if(conn){ conn.send({ type:'state', state: state }); }
    render();
  }

  function useSpecialWin(){
    if(!state || state.status !== 'playing') return;
    var myKey = role === 'host' ? 'p1' : 'p2';
    var me = state.players[myKey];
    if(me.charge < me.maxCharge) return;

    // 必殺技は通常の1秒ラウンドを待たず、その場で勝利を確定する。
    // 勝敗の確定は必ずホスト側で行う。
    if(role === 'host'){
      if(roundClosed) return;
      clearRoundTimer();
      stopTimerBarAnimation();
      state.status = 'finished';
      state.winner = 'p1';
      state.log = state.log.concat([{ round: state.round, text:'P1が上限チャージを使い、バリアを貫通する必殺技で問答無用の勝利！' }]);
      hostPending = { p1:null, p2:null };
      reveal = null;
      myMove = null;
      if(conn){ conn.send({ type:'state', state: state }); }
      render();
    } else {
      conn.send({ type:'special-win', round: state.round });
      showToast('必殺技を発動しました', 1500);
    }
  }

  function pickMove(action){
    if(!state || state.status!=='playing' || reveal || roundClosed) return;
    var myKey=role==='host'?'p1':'p2';
    var me=state.players[myKey];
    var currentAction=moveAction(myMove);
    var currentCount=moveAttackCount(myMove);
    var nextMove;

    if(action==='attack'){
      var nextCount=(currentAction==='attack')?currentCount+1:1;
      // そのラウンドで押せる攻撃回数は、現在のチャージ数まで。
      if(nextCount>me.charge || nextCount>me.maxCharge) return;
      nextMove=moveForAction('attack',nextCount);
    } else {
      // 「ためる」「バリア」を押したら、それまでの攻撃回数をリセット。
      nextMove=moveForAction(action);
    }

    myMove=nextMove;
    if(role==='host'){
      hostPending.p1=nextMove;
      tryResolveHost();
    } else {
      conn.send({type:'move',round:state.round,move:nextMove});
      render();
    }
  }

  function requestRestart(){
    if(role === 'host'){
      doRestart();
    } else {
      conn.send({ type:'restart-request' });
      showToast('再戦をリクエストしました', 1800);
    }
  }

  function copyCode(){
    var text = ui.roomCode;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('コードをコピーしました', 1800);
      }).catch(function(){ showToast(text, 2500); });
    } else {
      showToast(text, 2500);
    }
  }

    // battle
    if(!state){
      app.innerHTML = '<div class="wrap center muted">読み込み中…</div>';

    }

    var myKey = role === 'host' ? 'p1' : 'p2';
    var oppKey = role === 'host' ? 'p2' : 'p1';
    var me = state.players[myKey];

          '<div class="actionbox '+(reveal?ACTIONS[moveAction(reveal[oppKey])].cls:'')+'">' + oppActionHtml + '</div>' +
        '</div>' +
        '<div class="divider2">' + (showTimerBar ? '<div class="timerbar" id="timerbar" style="width:'+timerPercent+'%"></div>' : '') + '</div>' +
        '<div class="duel-half me">' +
          '<div class="actionbox '+(reveal?ACTIONS[moveAction(reveal[myKey])].cls:(myMove?ACTIONS[moveAction(myMove)].cls:''))+'">' + myActionHtml + '</div>' +
          '<div class="pipsrow">' + pipsHtml(me.charge) + '</div>' +
          '<div class="hpbox-outer"><div class="hpbox-fill" style="width:'+Math.round(me.hp/state.hpSetting*100)+'%"></div><div class="hpbox-num">'+me.hp+' / '+state.hpSetting+'</div></div>' +
          '<div class="namebox">'+esc(me.name)+'</div>';

    if(state.status === 'ready'){
      html += '<div class="actions">';
      Object.keys(ACTIONS).forEach(function(key){
        var a = ACTIONS[key];
        html += '<div class="abtn '+a.cls+' disabled" data-move="'+key+'">' +
          '<span class="ic">'+a.icon+'</span>' +
          '<span class="tt">'+a.label+'</span>' +
        '</div>';
      });
      html += '</div>';

      if(role === 'host'){
        /* 設定はduel-halfの通常レイアウトから切り離して固定表示。
           チャージ枠が30個で2段以上になっても、設定ボタンは移動しない。 */
        html += '<div class="setting-panel battle-setting-panel host-ready-settings">' +
          '<div class="setting-row">' +
            '<span class="setting-label">初期HP</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="hostHpMinus" type="button">−</button><span class="hpval">'+state.hpSetting+'</span><button class="hpbtn" id="hostHpPlus" type="button">＋</button></div>' +
          '</div>' +
          '<div class="setting-row">' +
            '<span class="setting-label">最大チャージ（必殺技）</span>' +
            '<div class="setting-ctrl"><button class="hpbtn" id="hostChargeMinus" type="button">−</button><span class="hpval">'+state.maxChargeSetting+'</span><button class="hpbtn" id="hostChargePlus" type="button">＋</button></div>' +
          '</div>' +
          '<div class="setting-note">HP：10〜100　／　最大チャージ：1〜30</div>' +
        '</div>';
      } else {
        html += '<div class="hpsetter">' +
          '<span class="hpsetter-label">初期HP：'+state.hpSetting+'　／　最大チャージ：'+state.maxChargeSetting+'</span>' +
        '</div>';
      }

      if(state.ready[myKey]){
        html += '<div class="waitline">準備完了！相手を待っています…</div>';
      } else if(role === 'guest'){
        // ゲスト側のスタートボタンは従来の位置・動作を維持。
        html += '<div class="actions"><div class="abtn startbtn" id="btnStart"><span class="tt">▶ スタート</span></div></div>';
      }
    }

    // 対戦中は、公開中も含めて行動ボタンを常に表示する。
    // 公開中・自分が選択済み・攻撃不能時は押せないだけで、表示は消さない。
    if(state.status === 'playing'){
      html += '<div class="actions">';
      Object.keys(ACTIONS).forEach(function(key){
        var a=ACTIONS[key];
        var picked=moveAction(myMove)===key;
        var attackCount=moveAttackCount(myMove);
        var disabled=!!reveal || (key==='attack' && (me.charge<=0 || attackCount>=me.charge));
        var label=a.label;
        if(key==='attack' && picked) label += ' ×'+attackCount+'（'+(BASE_DMG*attackCount)+'ダメージ）';
        html += '<div class="abtn '+a.cls+' '+(disabled?'disabled':'')+' '+(picked?'picked':'')+'" data-move="'+key+'">' +
          '<span class="ic">'+a.icon+'</span>' +
          '<span class="tt">'+label+'</span>' +
        '</div>';
      });
      html += '</div>';

      var specialDisabled = !!reveal || me.charge < me.maxCharge;
      html += '<div class="special-wrap">' +
        '<button type="button" class="special-btn '+(specialDisabled?'disabled':'')+'" id="btnSpecial" '+(specialDisabled?'disabled':'')+'>' +
          '<div class="tt">必殺技（'+me.maxCharge+'チャージ）</div>' +
          '<div class="sub">バリアを貫通して、その場で問答無用の勝利</div>' +
        '</button>' +
      '</div>';
    }

    html += '</div></div>'; // .duel-half.me, .duel-wrap

    html += '<div class="meta-line">ROUND ' + state.round + (lastLog ? ' ・ ' + esc(lastLog.text) : '') + '</div>';

    if(state.status === 'finished'){
      var title = state.winner === 'draw' ? '引き分け！' : (state.winner === myKey ? 'あなたの勝利！' : 'あなたの敗北…');
      html += '<div class="card center">' +
        '<h2 style="margin:0 0 8px">' + title + '</h2>' +
        '<button class="btn primary" id="btnRestart" style="margin-top:8px">もう一度対戦する</button>' +
      '</div>';
    }

    app.innerHTML = html;

    // render()でDOMが作り直されても、同じラウンドの時刻をそのまま使う。
    if(showTimerBar){
      updateTimerBar();
      animateTimerBar();
    } else {
      stopTimerBarAnimation();
    }

    var startBtn = document.getElementById('btnStart');
    if(startBtn) startBtn.addEventListener('click', pressStart);

    var hostHpMinus = document.getElementById('hostHpMinus');
    if(hostHpMinus) hostHpMinus.addEventListener('click', function(){ adjustHostHp(-10); });
    var hostHpPlus = document.getElementById('hostHpPlus');
    if(hostHpPlus) hostHpPlus.addEventListener('click', function(){ adjustHostHp(10); });
    var hostChargeMinus = document.getElementById('hostChargeMinus');
    if(hostChargeMinus) hostChargeMinus.addEventListener('click', function(){ adjustHostMaxCharge(-1); });
    var hostChargePlus = document.getElementById('hostChargePlus');
    if(hostChargePlus) hostChargePlus.addEventListener('click', function(){ adjustHostMaxCharge(1); });

    var restartBtn = document.getElementById('btnRestart');
    if(restartBtn) restartBtn.addEventListener('click', requestRestart);

    var specialBtn = document.getElementById('btnSpecial');
    if(specialBtn) specialBtn.addEventListener('click', useSpecialWin);

    var abtns = app.querySelectorAll('.abtn:not(.startbtn)');
    abtns.forEach(function(el){
      el.addEventListener('click', function(){
        if(el.classList.contains('disabled')) return;
        pickMove(el.getAttribute('data-move'));
      });
    });

  }

  function pipsHtml(charge){
    var out = '';
    for(var i=0;i<(state && state.players ? ((role==='host'?state.players.p1:state.players.p2).maxCharge || MAX_CHARGE) : MAX_CHARGE);i++){
      out += '<div class="pip2 ' + (i<charge?'on':'') + '"></div>';
    }
    return out;
  }

  render();
})();
</script>
</body>
</html>
